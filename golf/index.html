<title>Pocket Links</title>
<meta name="theme-color" content="#173b24">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --rough: #173b24;
    --ink: #f4efd9;
    --ink-dim: #b9c7a8;
    --chalk: #f2d98b;
    --flag: #e8553d;
    --card: #f4efd9;
    --card-ink: #1d2b1f;
    --card-line: #c9c2a4;
    --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  html, body { height: 100%; }
  body {
    background: var(--rough);
    color: var(--ink);
    font-family: var(--display);
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; padding-inline: 16px; box-sizing: border-box; }
  .hud { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-block: 10px 8px; }
  .hole-no { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
  .hole-name { font-weight: 800; font-size: 22px; line-height: 1.05; letter-spacing: -.01em; }
  .stats { display: flex; gap: 14px; font-family: var(--mono); text-align: right; }
  .stat b { display: block; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--chalk); }
  .stat span { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); }
  .stage { flex: 1; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .foot { display: flex; align-items: center; gap: 12px; padding-block: 8px 12px; font-family: var(--mono); font-size: 12px; }
  .lie { padding: 3px 8px; border-radius: 99px; background: rgba(244,239,217,.12); text-transform: uppercase; letter-spacing: .1em; font-size: 10px; white-space: nowrap; }
  .meter { flex: 1; height: 8px; border-radius: 99px; background: rgba(244,239,217,.12); overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--chalk), var(--flag)); }
  .hint { color: var(--ink-dim); white-space: nowrap; }
  .toast { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); background: var(--card); color: var(--card-ink); font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 6px; pointer-events: none; transition: opacity .3s; white-space: nowrap; }
  .overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(10,26,16,.62); padding-inline: 16px; z-index: 5; }
  .card { background: var(--card); color: var(--card-ink); border-radius: 10px; padding: 22px 20px; width: 100%; max-width: 380px; box-sizing: border-box; box-shadow: 0 20px 50px rgba(0,0,0,.4); }
  .card h2 { margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -.02em; line-height: 1; text-wrap: balance; }
  .card .kicker { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #6a7a5c; margin-bottom: 8px; }
  .card p { font-size: 15px; line-height: 1.45; margin: 12px 0 0; }
  .card ul { margin: 12px 0 0; padding-left: 18px; font-size: 14px; line-height: 1.5; }
  .btn { margin-top: 18px; width: 100%; border: 0; border-radius: 8px; padding: 14px; font: 800 17px var(--display); background: var(--rough); color: var(--ink); cursor: pointer; }
  .btn:focus-visible { outline: 3px solid var(--flag); outline-offset: 2px; }
  .sc-wrap { overflow-x: auto; margin-top: 14px; }
  table.sc { border-collapse: collapse; font-family: var(--mono); font-size: 12px; width: 100%; font-variant-numeric: tabular-nums; }
  .sc th, .sc td { border: 1px solid var(--card-line); text-align: center; padding: 5px 2px; min-width: 22px; }
  .sc th { font-weight: 500; color: #6a7a5c; }
  .sc td.lbl, .sc th.lbl { text-align: left; padding-left: 6px; }
  .mk { display: inline-grid; place-items: center; width: 20px; height: 20px; box-sizing: border-box; font-weight: 600; }
  .mk.b1 { border: 1.5px solid var(--card-ink); border-radius: 50%; }
  .mk.b2 { border: 1.5px solid var(--card-ink); border-radius: 50%; box-shadow: 0 0 0 2px var(--card), 0 0 0 3.5px var(--card-ink); }
  .mk.o1 { border: 1.5px solid var(--card-ink); }
  .mk.o2 { border: 1.5px solid var(--card-ink); box-shadow: 0 0 0 2px var(--card), 0 0 0 3.5px var(--card-ink); }
  .legend { font-family: var(--mono); font-size: 11px; color: #6a7a5c; margin-top: 8px; }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<div class="app">
  <header class="hud">
    <div>
      <div class="hole-no" id="holeNo">Hole 1 of 9 · Par 3</div>
      <div class="hole-name" id="holeName">Front Porch</div>
    </div>
    <div class="stats">
      <div class="stat"><b id="strokes">0</b><span>Strokes</span></div>
      <div class="stat"><b id="toPar">E</b><span>To par</span></div>
    </div>
  </header>
  <div class="stage" id="stage">
    <canvas id="c"></canvas>
    <div class="toast" id="toast" style="opacity:0"></div>
  </div>
  <footer class="foot">
    <span class="lie" id="lie">Tee</span>
    <div class="meter"><i id="meter"></i></div>
    <span class="hint" id="hint">Drag back to aim</span>
  </footer>
</div>

<div class="overlay" id="overlay">
  <div class="card" id="card"></div>
</div>

<script>
(() => {
  const W = 400, H = 700, BR = 5, CUP = 8;
  const R = (x, y, w, h) => ({ t: 'r', x, y, w, h });
  const C = (x, y, r) => ({ t: 'c', x, y, r });
  const E = (x, y, rx, ry) => ({ t: 'e', x, y, rx, ry });

  const HOLES = [
    { name: 'Front Porch', par: 3, tee: [200, 630], cup: [200, 120],
      fairway: [R(140, 150, 120, 520)], green: [C(200, 130, 62)],
      sand: [C(290, 190, 26), C(112, 235, 22)] },
    { name: 'The Elbow', par: 4, tee: [120, 630], cup: [300, 112],
      fairway: [R(50, 430, 140, 240), R(50, 430, 300, 110), R(240, 110, 110, 420)],
      green: [C(300, 122, 58)], water: [E(140, 250, 85, 110)], sand: [C(365, 470, 24)],
      trees: [[375, 330, 16], [30, 360, 18]] },
    { name: 'Crossing', par: 4, tee: [200, 635], cup: [205, 125],
      fairway: [R(120, 470, 160, 200), R(110, 110, 180, 190)],
      water: [R(0, 330, 400, 95)], green: [C(200, 140, 58)],
      sand: [C(118, 110, 24), C(288, 205, 24)] },
    { name: 'Switchbacks', par: 3, tee: [320, 630], cup: [82, 118],
      fairway: [R(30, 40, 340, 640)], green: [C(92, 128, 62)], sand: [C(300, 560, 26)],
      walls: [R(0, 440, 270, 14), R(130, 270, 270, 14)] },
    { name: 'Pine Alley', par: 4, tee: [200, 640], cup: [200, 110],
      fairway: [R(130, 60, 140, 610)], green: [C(200, 120, 58)], sand: [C(272, 88, 22)],
      trees: [[118, 520, 20], [292, 470, 22], [158, 380, 18], [252, 318, 20], [108, 250, 22], [302, 222, 18], [200, 430, 14]] },
    { name: 'Island', par: 3, tee: [200, 630], cup: [185, 208],
      fairway: [R(140, 560, 120, 110)], water: [R(0, 40, 400, 510)],
      green: [C(200, 200, 70)], sand: [C(258, 148, 18)] },
    { name: 'Sandbox', par: 4, tee: [200, 640], cup: [265, 110],
      fairway: [R(60, 60, 280, 610)], green: [C(260, 120, 58)],
      sand: [C(140, 470, 40), C(262, 420, 34), C(118, 300, 36), C(252, 262, 30), C(186, 172, 26), C(334, 176, 22)] },
    { name: 'Serpent', par: 5, tee: [90, 640], cup: [300, 108],
      fairway: [R(40, 500, 320, 170), R(260, 300, 100, 260), R(40, 300, 320, 90), R(40, 70, 100, 300), R(40, 70, 300, 90)],
      green: [C(292, 115, 55)], water: [R(0, 400, 250, 90)], sand: [C(196, 118, 20)],
      walls: [R(150, 172, 250, 14)] },
    { name: 'Homeward', par: 5, tee: [210, 640], cup: [200, 100],
      fairway: [R(150, 470, 120, 200), R(60, 270, 280, 150), R(150, 60, 120, 200)],
      water: [R(0, 430, 140, 60), E(310, 445, 60, 28)], green: [C(200, 110, 58)],
      sand: [C(272, 110, 24), C(128, 92, 22)],
      trees: [[100, 205, 20], [310, 190, 20], [200, 345, 16]] },
  ];
  HOLES.forEach(h => ['fairway', 'green', 'sand', 'water', 'walls', 'trees'].forEach(k => h[k] = h[k] || []));

  const BOUNDS = [R(-60, -60, W + 120, 60), R(-60, H, W + 120, 60), R(-60, 0, 60, H), R(W, 0, 60, H)];
  const FRICTION = { green: .975, fairway: .97, rough: .93, sand: .85, tee: .97 };
  const LANDING = { green: .45, fairway: .7, rough: .45, sand: .15 };
  const LIE = { green: 1, fairway: 1, rough: .8, sand: .6, tee: 1 };
  const LIE_LABEL = { green: 'Green', fairway: 'Fairway', rough: 'Rough', sand: 'Bunker', tee: 'Tee' };
  const AIR_DRAG = .992;

  const $ = id => document.getElementById(id);
  const canvas = $('c'), ctx = canvas.getContext('2d'), stage = $('stage');
  let view = { s: 1, ox: 0, oy: 0, dpr: 1 };
  let courseLayer = null;

  let holeIdx = 0, scores = [], strokes = 0, hole = HOLES[0];
  let ball = { x: 0, y: 0, vx: 0, vy: 0, air: 0, airT: 0, h: 0, sink: 0 };
  let lastPos = null, phase = 'intro', onTee = true;
  let aim = null;

  function inside(s, x, y) {
    if (s.t === 'r') return x >= s.x && x <= s.x + s.w && y >= s.y && y <= s.y + s.h;
    if (s.t === 'c') return (x - s.x) ** 2 + (y - s.y) ** 2 <= s.r * s.r;
    const dx = (x - s.x) / s.rx, dy = (y - s.y) / s.ry;
    return dx * dx + dy * dy <= 1;
  }
  function surface(x, y) {
    if (hole.sand.some(s => inside(s, x, y))) return 'sand';
    if (hole.green.some(s => inside(s, x, y))) return 'green';
    if (hole.fairway.some(s => inside(s, x, y))) return 'fairway';
    if (hole.water.some(s => inside(s, x, y))) return 'water';
    return 'rough';
  }
  const lie = () => onTee ? 'tee' : surface(ball.x, ball.y);

  // ---------- rendering ----------
  function shapePath(c, s) {
    c.beginPath();
    if (s.t === 'r') c.rect(s.x, s.y, s.w, s.h);
    else if (s.t === 'c') c.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    else c.ellipse(s.x, s.y, s.rx, s.ry, 0, 0, Math.PI * 2);
  }
  function fillShapes(c, shapes, fill) { shapes.forEach(s => { shapePath(c, s); c.fillStyle = fill; c.fill(); }); }
  function stripes(c, shapes, color, band, angle) {
    c.save();
    c.beginPath();
    shapes.forEach(s => {
      if (s.t === 'r') c.rect(s.x, s.y, s.w, s.h);
      else if (s.t === 'c') { c.moveTo(s.x + s.r, s.y); c.arc(s.x, s.y, s.r, 0, Math.PI * 2); }
      else { c.moveTo(s.x + s.rx, s.y); c.ellipse(s.x, s.y, s.rx, s.ry, 0, 0, Math.PI * 2); }
    });
    c.clip();
    c.translate(W / 2, H / 2); c.rotate(angle); c.fillStyle = color;
    for (let y = -H; y < H; y += band * 2) c.fillRect(-W, y, W * 2, band);
    c.restore();
  }
  function seeded(n) { let s = n * 9301 + 49297; return () => (s = (s * 9301 + 49297) % 233280) / 233280; }

  function buildCourse() {
    const cv = document.createElement('canvas');
    cv.width = Math.round(W * view.s * view.dpr); cv.height = Math.round(H * view.s * view.dpr);
    const c = cv.getContext('2d');
    c.scale(view.s * view.dpr, view.s * view.dpr);
    const rnd = seeded(holeIdx + 3);

    c.fillStyle = '#1f4a2c'; c.fillRect(0, 0, W, H);
    for (let i = 0; i < 900; i++) { c.fillStyle = rnd() > .5 ? 'rgba(255,255,255,.035)' : 'rgba(0,0,0,.06)'; c.fillRect(rnd() * W, rnd() * H, 2, 2); }

    hole.water.forEach(s => {
      shapePath(c, s); c.fillStyle = '#1d5f86'; c.fill();
      c.lineWidth = 4; c.strokeStyle = '#3f8fb6'; c.stroke();
    });
    stripes(c, hole.water, 'rgba(255,255,255,.05)', 3, -.3);

    fillShapes(c, hole.fairway, '#3f8a44');
    stripes(c, hole.fairway, 'rgba(255,255,255,.055)', 22, 0);

    hole.green.forEach(s => { c.beginPath(); c.arc(s.x, s.y, s.r + 7, 0, Math.PI * 2); c.fillStyle = '#4c9a4b'; c.fill(); });
    fillShapes(c, hole.green, '#63b35a');
    stripes(c, hole.green, 'rgba(255,255,255,.07)', 9, .6);

    hole.sand.forEach(s => {
      shapePath(c, s); c.fillStyle = '#dcc68c'; c.fill();
      c.lineWidth = 2; c.strokeStyle = '#b9a168'; c.stroke();
    });
    c.save();
    hole.sand.forEach(s => { for (let i = 0; i < s.r * 3; i++) {
      const a = rnd() * Math.PI * 2, d = Math.sqrt(rnd()) * (s.r - 3);
      c.fillStyle = 'rgba(120,95,50,.25)'; c.fillRect(s.x + Math.cos(a) * d, s.y + Math.sin(a) * d, 1.2, 1.2);
    } });
    c.restore();

    // tee box
    const [tx, ty] = hole.tee;
    c.fillStyle = '#58a654'; c.fillRect(tx - 22, ty - 14, 44, 28);
    [[tx - 16, ty - 8], [tx + 16, ty - 8]].forEach(([x, y]) => { c.beginPath(); c.arc(x, y, 3, 0, Math.PI * 2); c.fillStyle = '#f4efd9'; c.fill(); });

    hole.walls.forEach(w => {
      c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(w.x + 3, w.y + 5, w.w, w.h);
      c.fillStyle = '#123321'; c.fillRect(w.x, w.y, w.w, w.h);
      c.fillStyle = '#2a5a36'; c.fillRect(w.x, w.y, w.w, 4);
    });

    hole.trees.forEach(([x, y, r]) => {
      c.beginPath(); c.arc(x + 4, y + 6, r, 0, Math.PI * 2); c.fillStyle = 'rgba(0,0,0,.28)'; c.fill();
      c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fillStyle = '#143d24'; c.fill();
      c.beginPath(); c.arc(x - r * .3, y - r * .3, r * .55, 0, Math.PI * 2); c.fillStyle = '#23603a'; c.fill();
    });

    // cup
    const [cx, cy] = hole.cup;
    c.beginPath(); c.arc(cx, cy, CUP, 0, Math.PI * 2); c.fillStyle = '#0c1a10'; c.fill();
    c.lineWidth = 1.5; c.strokeStyle = 'rgba(255,255,255,.5)'; c.stroke();
    courseLayer = cv;
  }

  function resize() {
    const r = stage.getBoundingClientRect();
    view.dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = Math.round(r.width * view.dpr); canvas.height = Math.round(r.height * view.dpr);
    view.s = Math.min(r.width / W, r.height / H);
    view.ox = (r.width - W * view.s) / 2; view.oy = (r.height - H * view.s) / 2;
    buildCourse();
  }

  function estimate(power) {
    const l = lie();
    if (l === 'green') { const v = power * 7; return v / (1 - FRICTION.green) * .8; }
    const v = power * 9 * LIE[l], T = airFrames(power, l);
    return v * (1 - AIR_DRAG ** T) / (1 - AIR_DRAG);
  }
  const airFrames = (power, l) => Math.round((.35 + power * .75) * 60 * (l === 'sand' ? .8 : 1));

  function draw(t) {
    const { s, ox, oy, dpr } = view;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#173b24'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(s * dpr, 0, 0, s * dpr, ox * dpr, oy * dpr);
    if (courseLayer) ctx.drawImage(courseLayer, 0, 0, W, H);

    // aim guide
    if (aim && aim.power > .02) {
      const d = estimate(aim.power), ex = ball.x + aim.dx * d, ey = ball.y + aim.dy * d;
      ctx.save();
      ctx.setLineDash([2, 7]); ctx.lineCap = 'round'; ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(244,239,217,.85)';
      ctx.beginPath(); ctx.moveTo(ball.x, ball.y); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(ex, ey, lie() === 'green' ? 5 : 12, 0, Math.PI * 2);
      ctx.lineWidth = 2; ctx.strokeStyle = aim.power > .9 ? '#e8553d' : '#f2d98b'; ctx.stroke();
      ctx.restore();
    }

    // flag
    const [cx, cy] = hole.cup;
    const nearFlag = Math.hypot(ball.x - cx, ball.y - cy) < 40 && phase !== 'moving';
    if (!nearFlag) {
      const wave = Math.sin(t / 300) * 2;
      ctx.strokeStyle = '#f4efd9'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, cy - 46); ctx.stroke();
      ctx.fillStyle = '#e8553d';
      ctx.beginPath(); ctx.moveTo(cx, cy - 46); ctx.lineTo(cx + 20, cy - 40 + wave); ctx.lineTo(cx, cy - 33); ctx.closePath(); ctx.fill();
    }

    // ball
    if (phase !== 'holed' || ball.sink < 1) {
      const h = ball.h, k = phase === 'holed' ? 1 - ball.sink : 1;
      ctx.beginPath(); ctx.ellipse(ball.x + 2 + h * .35, ball.y + 3 + h * .5, BR * k, BR * .8 * k, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fill();
      const r = BR * (1 + h / 70) * k;
      ctx.beginPath(); ctx.arc(ball.x, ball.y - h * .6, r, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff'; ctx.fill();
      ctx.lineWidth = .8; ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.stroke();
    }
  }

  // ---------- physics ----------
  function collideRect(w, e) {
    const cx = Math.max(w.x, Math.min(ball.x, w.x + w.w)), cy = Math.max(w.y, Math.min(ball.y, w.y + w.h));
    let dx = ball.x - cx, dy = ball.y - cy, d = Math.hypot(dx, dy);
    if (d >= BR) return;
    if (d === 0) { const sp = Math.hypot(ball.vx, ball.vy) || 1; dx = -ball.vx / sp; dy = -ball.vy / sp; d = 1; }
    else { dx /= d; dy /= d; }
    ball.x = cx + dx * BR; ball.y = cy + dy * BR;
    bounce(dx, dy, e);
  }
  function collideTree([tx, ty, r]) {
    let dx = ball.x - tx, dy = ball.y - ty; const d = Math.hypot(dx, dy);
    if (d >= r + BR || d === 0) return;
    dx /= d; dy /= d;
    ball.x = tx + dx * (r + BR); ball.y = ty + dy * (r + BR);
    bounce(dx, dy, .35);
  }
  function bounce(nx, ny, e) {
    const dot = ball.vx * nx + ball.vy * ny;
    if (dot < 0) { ball.vx -= (1 + e) * dot * nx; ball.vy -= (1 + e) * dot * ny; }
  }

  function step() {
    if (phase === 'holed') { ball.sink = Math.min(1, ball.sink + .06); return; }
    if (phase !== 'moving') return;
    const SUB = 4;
    for (let i = 0; i < SUB; i++) {
      ball.x += ball.vx / SUB; ball.y += ball.vy / SUB;
      hole.walls.forEach(w => collideRect(w, .5));
      BOUNDS.forEach(w => collideRect(w, .5));
      hole.trees.forEach(collideTree);
      if (ball.air === 0) {
        const sp = Math.hypot(ball.vx, ball.vy);
        if (Math.hypot(ball.x - hole.cup[0], ball.y - hole.cup[1]) < CUP - 1 && sp < 5.5) return holeOut();
      }
    }
    if (ball.air > 0) {
      ball.air--;
      ball.vx *= AIR_DRAG; ball.vy *= AIR_DRAG;
      const p = 1 - ball.air / ball.airT;
      ball.h = 4 * ball.peak * p * (1 - p);
      if (ball.air === 0) {
        ball.h = 0; onTee = false;
        const s = surface(ball.x, ball.y);
        if (s === 'water') return splash();
        ball.vx *= LANDING[s]; ball.vy *= LANDING[s];
        if (s === 'sand') toast('Bunker');
      }
      return;
    }
    onTee = false;
    const s = surface(ball.x, ball.y);
    if (s === 'water') return splash();
    ball.vx *= FRICTION[s]; ball.vy *= FRICTION[s];
    if (Math.hypot(ball.vx, ball.vy) < .05) {
      ball.vx = ball.vy = 0;
      if (strokes >= 10) { toast('Picked up at 10'); return finishHole(10); }
      phase = 'aim'; updateHud();
    }
  }

  function splash() {
    strokes++;
    toast('Water · 1 stroke penalty');
    buzz([40, 60, 40]);
    Object.assign(ball, lastPos, { vx: 0, vy: 0, air: 0, h: 0 });
    onTee = lastPos.onTee;
    phase = 'aim'; updateHud();
    if (strokes >= 10) { toast('Picked up at 10'); finishHole(10); }
  }

  function holeOut() {
    ball.x = hole.cup[0]; ball.y = hole.cup[1]; ball.vx = ball.vy = 0; ball.sink = 0;
    phase = 'holed'; buzz(30);
    setTimeout(() => finishHole(strokes), 700);
  }

  function shoot(power, dx, dy) {
    const l = lie();
    lastPos = { x: ball.x, y: ball.y, onTee };
    strokes++;
    if (l === 'green') {
      ball.vx = dx * power * 7; ball.vy = dy * power * 7; ball.air = 0;
    } else {
      const v = power * 9 * LIE[l];
      ball.vx = dx * v; ball.vy = dy * v;
      ball.airT = ball.air = Math.max(1, airFrames(power, l));
      ball.peak = 10 + power * 40;
    }
    phase = 'moving'; buzz(12); updateHud();
  }

  // ---------- flow ----------
  const scoreName = (n, par) => {
    if (n === 1) return 'Hole in one';
    const d = n - par;
    return ({ '-3': 'Albatross', '-2': 'Eagle', '-1': 'Birdie', 0: 'Par', 1: 'Bogey', 2: 'Double bogey', 3: 'Triple bogey' })[d] || `+${d}`;
  };
  const totalPar = n => HOLES.slice(0, n).reduce((a, h) => a + h.par, 0);
  const fmtToPar = d => d === 0 ? 'E' : d > 0 ? `+${d}` : `${d}`;

  function finishHole(n) {
    phase = 'card';
    scores[holeIdx] = n;
    const last = holeIdx === HOLES.length - 1;
    if (last) return showFinal();
    const d = n - hole.par;
    showCard(`
      <div class="kicker">Hole ${holeIdx + 1} · Par ${hole.par}</div>
      <h2>${scoreName(n, hole.par)}</h2>
      <p>${n} stroke${n === 1 ? '' : 's'} on ${hole.name}. You are ${fmtToPar(scores.reduce((a, b) => a + b, 0) - totalPar(holeIdx + 1))} through ${holeIdx + 1}.</p>
      ${scorecard()}
      <button class="btn" id="next">Walk to hole ${holeIdx + 2}</button>`, () => loadHole(holeIdx + 1));
    updateHud(d);
  }

  function showFinal() {
    const total = scores.reduce((a, b) => a + b, 0), par = totalPar(HOLES.length);
    let best = null;
    try { best = +localStorage.getItem('pocketlinks.best') || null; if (!best || total < best) localStorage.setItem('pocketlinks.best', total); } catch (e) {}
    const record = !best || total < best;
    showCard(`
      <div class="kicker">Round complete · Par ${par}</div>
      <h2>${total} (${fmtToPar(total - par)})</h2>
      <p>${record ? 'New personal best on this device.' : `Your best here is ${best}.`}</p>
      ${scorecard()}
      <button class="btn" id="next">Play another round</button>`, () => { scores = []; loadHole(0); });
  }

  function scorecard() {
    const mark = (n, par) => {
      if (n == null) return '';
      const d = n - par, cls = d <= -2 ? 'b2' : d === -1 ? 'b1' : d === 1 ? 'o1' : d >= 2 ? 'o2' : '';
      return `<span class="mk ${cls}">${n}</span>`;
    };
    const cells = f => HOLES.map((h, i) => `<td>${f(h, i)}</td>`).join('');
    const tot = scores.reduce((a, b) => a + (b || 0), 0);
    return `<div class="sc-wrap"><table class="sc">
      <tr><th class="lbl">Hole</th>${HOLES.map((_, i) => `<th>${i + 1}</th>`).join('')}<th>Tot</th></tr>
      <tr><td class="lbl">Par</td>${cells(h => h.par)}<td>${totalPar(HOLES.length)}</td></tr>
      <tr><td class="lbl">You</td>${cells((h, i) => mark(scores[i], h.par))}<td>${tot || ''}</td></tr>
    </table></div><div class="legend">○ birdie · ◎ eagle · □ bogey · ▣ double or worse</div>`;
  }

  function showCard(html, onNext) {
    $('card').innerHTML = html;
    $('overlay').hidden = false;
    const b = $('next'); b.focus({ preventScroll: true });
    b.onclick = () => { $('overlay').hidden = true; onNext(); };
  }

  function loadHole(i) {
    holeIdx = i; hole = HOLES[i]; strokes = 0; onTee = true;
    Object.assign(ball, { x: hole.tee[0], y: hole.tee[1], vx: 0, vy: 0, air: 0, h: 0, sink: 0 });
    lastPos = { x: ball.x, y: ball.y, onTee: true };
    phase = 'aim';
    buildCourse(); updateHud();
  }

  function updateHud() {
    $('holeNo').textContent = `Hole ${holeIdx + 1} of ${HOLES.length} · Par ${hole.par}`;
    $('holeName').textContent = hole.name;
    $('strokes').textContent = strokes;
    const played = scores.slice(0, holeIdx).reduce((a, b) => a + b, 0);
    $('toPar').textContent = fmtToPar(played - totalPar(holeIdx));
    const l = lie();
    $('lie').textContent = LIE_LABEL[l] || l;
    $('hint').textContent = phase === 'moving' ? '…' : l === 'green' ? 'Putt: drag back' : l === 'sand' ? 'Bunker: 60% power' : l === 'rough' ? 'Rough: 80% power' : 'Drag back to aim';
  }

  let toastTimer;
  function toast(msg) {
    const el = $('toast'); el.textContent = msg; el.style.opacity = 1;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.style.opacity = 0, 1600);
  }
  function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }

  // ---------- input ----------
  canvas.addEventListener('pointerdown', e => {
    if (phase !== 'aim') return;
    canvas.setPointerCapture(e.pointerId);
    aim = { sx: e.clientX, sy: e.clientY, dx: 0, dy: -1, power: 0 };
  });
  canvas.addEventListener('pointermove', e => {
    if (!aim) return;
    const px = aim.sx - e.clientX, py = aim.sy - e.clientY, len = Math.hypot(px, py);
    if (len > 4) { aim.dx = px / len; aim.dy = py / len; }
    aim.power = Math.min(len / 150, 1);
    $('meter').style.width = `${aim.power * 100}%`;
    $('hint').textContent = `${Math.round(aim.power * 100)}% · release to hit`;
  });
  const release = () => {
    if (!aim) return;
    const a = aim; aim = null; $('meter').style.width = '0';
    if (a.power > .05 && phase === 'aim') shoot(a.power, a.dx, a.dy); else updateHud();
  };
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', () => { aim = null; $('meter').style.width = '0'; updateHud(); });

  // ---------- loop ----------
  let acc = 0, prev = performance.now();
  function frame(t) {
    acc += Math.min(t - prev, 100); prev = t;
    while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
    draw(t);
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  new ResizeObserver(resize).observe(stage);
  loadHole(0);
  resize();
  requestAnimationFrame(frame);

  showCard(`
    <div class="kicker">Nine holes · Par ${totalPar(HOLES.length)}</div>
    <h2>Pocket Links</h2>
    <p>A nine-hole course you play with one thumb.</p>
    <ul>
      <li>Drag back from anywhere and release to hit. The ring shows where the ball will land.</li>
      <li>Full shots fly over sand and water. On the green you putt along the ground.</li>
      <li>Rough costs 20% power and bunkers cost 40%. Water is a one-stroke penalty.</li>
      <li>Hedges and trees block the ball, even in the air.</li>
    </ul>
    <button class="btn" id="next">Tee off</button>`, () => { phase = 'aim'; updateHud(); });
  phase = 'card';
})();
</script>
